[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazify"
version = "1.1.4"
description = "Amazon Music runtime customization companion inspired by Spicetify."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psutil>=7.2.2",
  "websocket-client>=1.9.2",
]

[project.optional-dependencies]
build = [
  "Pillow>=12.3.0",
  "pyinstaller>=6.22.3",
]

[project.scripts]
amazify = "amazify.cli:main"

[tool.setuptools.packages.find]
include = ["amazify*"]

[tool.setuptools.package-data]
amazify = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["amazify"]
relative_files = true
omit = [
  "amazify/__main__.py",
  "amazify/window_identity.py",
]

[tool.coverage.report]
fail_under = 45
show_missing = true

[tool.ruff]
target-version = "py310"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
